name: Test

# The unit tests on every push and pull request, not only when a release tag
# is pushed (publish.yml runs them too, as the release gate).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # 22, not 20: `node --test` takes a glob only from Node 21 on.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
